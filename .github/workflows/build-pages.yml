name: Build Vexora for Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server/**'
      - 'build-protect.js'
      - 'package*.json'
      - '.github/workflows/build-pages.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node build-protect.js
      - uses: actions/upload-artifact@v4
        with:
          name: vexora-cloudflare-pages
          path: protected/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
